# Copy to ~/.config/oryn/config.toml

# Project roots to watch. Each is scanned (4 levels deep) for lockfiles.
# Normally managed with `oryn add` / `oryn rm` or the Projects tab.
projects = [
  "~/code/myapp",
  "~/code/api",
]

# GitHub integration (PR review queue, CI). On by default when a token is
# available via `gh auth login` or GH_TOKEN; set to false to disable.
# github = true

# Also watch status pages of vendors found in your lockfiles (Sentry, Twilio,
# MongoDB, ...). On by default.
# stack_status = true

# Map a project folder to a GitHub repo when its git remote isn't the one you
# want (oryn normally detects it from `origin`).
# [repos]
# "~/code/app" = "owner/name"

# Auto-refresh interval.
refresh = "10m"

# Upstream services (any statuspage-compatible /api/v2/status.json).
# Setting any [[service]] replaces the built-in list.
# [[service]]
# name = "GitHub"
# url  = "https://www.githubstatus.com"
#
# [[service]]
# name = "Stripe"
# url  = "https://www.stripestatus.com"
